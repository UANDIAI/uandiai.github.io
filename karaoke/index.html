0.0536193%">Back to event</button></section></div><section class="event" id="event" hidden><h2>The Karaoke Klassic</h2><p>Your ballot is locked.</p><button id="review">View my ballot</button></section>
<dialog id="confirm"><h2>Lock your vote?</h2><p id="confirm-name"></p><p>You’ll need an assigned event admin to reopen this ballot.</p><button class="gold" id="confirm-lock">Lock my vote</button><button id="keep">Keep editing</button></dialog>
<footer>A product of <strong>UANDI AI LLC</strong> · Designed, built &amp; owned by UANDI AI LLC</footer></main><script>
const $ = id => document.getElementById(id);
const status = document.querySelector('.note');
const eventId = new URLSearchParams(location.search).get('event');
let token;
let ballot;
let checkedIn=false;

let busy = true;
const forms = [...document.querySelectorAll('.screen')];
const light = document.createElement('span');
light.className = 'voting-light';
light.setAttribute('aria-hidden','true');
$('flow').append(light);

function render() {
 const stage = ballot?.locked ? 'locked' : ballot?.name ? 'edit' : 'enter';
 light.classList.toggle('is-open', Boolean(ballot?.open && !ballot?.locked));
 light.classList.toggle('is-locked', Boolean(ballot?.locked));
 light.classList.toggle('is-edit', stage === 'edit');
 light.hidden = stage === 'edit' && !ballot?.open;
 $('flow').style.setProperty('--position', {
  enter:'10.67708333%', edit:'49.82638889%', locked:'89.32291667%'
 }[stage]);
 for (const screen of forms) {
  const active = screen.dataset.screen === stage;
  screen.classList.toggle('active', active);
  for (const control of screen.querySelectorAll('input,button')) {
   control.disabled = !active || busy || (stage !== 'locked' && !ballot?.open);
  }
 }
 $('change').value = ballot?.name ?? '';
 $('name').textContent = ballot?.name ?? '';
 for(const form of [$('enter'),$('edit')]){
  let deadline = form.querySelector('.live-deadline');
  if(!deadline){
   deadline=document.createElement('div');
   deadline.className='live-deadline';
   form.append(deadline);
  }
  deadline.textContent = ballot?.open
   ? 'Voting closes at '+new Intl.DateTimeFormat('en-US',{timeStyle:'short',timeZone:'America/Chicago'}).format(new Date(ballot.closesAt))+' CT'
   : 'Voting closed';
 }
}

async function request(operation, choice=null, contact=null) {
 const response = await fetch('https://script.google.com/macros/s/AKfycbxx89zFYp9zGs6M9sE8ZJEnJCWKZKIyH-m2P7LSuLD87Mdzyt8ULzbE5nZcGNe278Lh8Q/exec', {
  method:'POST',credentials:'omit',signal:AbortSignal.timeout(15000),headers:{'Content-Type':'text/plain;charset=UTF-8'},
  body:JSON.stringify({eventId,token,action:operation,choice,contact,revision:ballot?.revision||0})
 });
 if(!response.ok)throw new Error('Voting server is unavailable. Try again.');
 const result=await response.json();
 if(!result.ok)throw new Error(result.error);
 return result.ballot;
}
function showStatus(message) {
 status.textContent = message;
 if(ballot?.lookup){
  const code=document.createElement('small');
  code.textContent='Ballot lookup ID: '+ballot.lookup;
  status.append(code);
 }
}
async function run(operation, choice=null) {
 if(busy)return;
 busy=true;
 render();
 try{
  ballot=await request(operation,choice);
  if(!ballot.locked){
   $('flow').hidden=false;
   $('event').hidden=true;
  }
  showStatus(!ballot.open?'Voting is closed.':operation==='lock'?'Your vote is locked.':operation==='save'?'Choice saved.':'Audience voting');
 }catch(error){showStatus(error.message);}
 finally{busy=false;render();}
}
function inputName(id){return $(id).value.trim().replace(/\s+/g,' ');}
for(const [form,input] of [['enter','first'],['edit','change']]){
 $(form).onsubmit=event=>{
  event.preventDefault();
  const name=inputName(input);
  if(name)void run('save',name);
  else showStatus('Enter the performer’s name.');
 };
}
$('lock').onclick=()=>{
 if(inputName('change')!==ballot?.name){showStatus('Save your changes before locking your vote.');return;}
 $('confirm-name').textContent=ballot.name;
 $('confirm').showModal();
};
$('confirm-lock').onclick=()=>{$('confirm').close();void run('lock');};
$('keep').onclick=()=>$('confirm').close();
$('back').onclick=()=>{$('flow').hidden=true;$('event').hidden=false;};
$('review').onclick=()=>{$('event').hidden=true;$('flow').hidden=false;};
window.addEventListener('focus',()=>{if(token&&checkedIn&&!busy)void run('read');});
const reload=document.createElement('button');
reload.type='button';
reload.textContent='Refresh ballot';
reload.onclick=()=>void run('read');
document.querySelector('footer').append(reload);
render();
try{
 if(!eventId) throw new Error('Open the voting link for your event.');
 const storageKey = 'klassic-google-voter';
 token=localStorage.getItem(storageKey);
 if(!/^[a-f0-9]{64}$/.test(token || '')){
  token=Array.from(crypto.getRandomValues(new Uint8Array(32)),byte=>byte.toString(16).padStart(2,'0')).join('');
  localStorage.setItem(storageKey,token);
 }
 checkedIn=localStorage.getItem('klassic-checkin:'+eventId)==='yes';
 busy=false;
 if(checkedIn){void run('read');}
 else{
  $('checkin').hidden=false;
  $('flow').hidden=true;
  status.hidden=true;
  reload.hidden=true;
 }
 $('checkin').onsubmit=async e=>{
  e.preventDefault();
  if(busy)return;
  busy=true;
  $('checkin-go').disabled=true;
  $('checkin-status').textContent='Saving check-in…';
  try{
   await request('checkin',null,{name:$('checkin-name').value,phone:$('checkin-phone').value,sms:$('sms-opt-in').checked});
   $('checkin-status').textContent='Opening the ballot…';
   ballot=await request('read');
   if(!ballot?.open && !ballot?.locked) throw new Error('Voting is closed for this event.');
   checkedIn=true;
   try{localStorage.setItem('klassic-checkin:'+eventId,'yes');}catch{}
   $('checkin').hidden=true;
   $('checkin').reset();
   $('flow').hidden=false;
   status.hidden=false;
   reload.hidden=false;
   busy=false;
   render();
   showStatus(ballot.locked?'Your vote is locked.':'Audience voting');
   document.activeElement?.blur();
   window.scrollTo(0,0);
   requestAnimationFrame(()=>window.scrollTo(0,0));
  }catch(error){
   $('checkin-status').textContent=error.name==='TimeoutError' ? 'The voting server took too long. Tap Continue to retry.' : error.message;
  }finally{
   busy=false;
   $('checkin-go').disabled=false;
  }
 };
}catch(error){showStatus(error.message);token=null;reload.disabled=true;}

</script></body></html>
