<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>UANDI AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: #070708; color: #ecebe6; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px 16px; -webkit-font-smoothing: antialiased;
      background-image: radial-gradient(1200px 500px at 50% -200px, rgba(212,182,90,0.09), transparent 60%); }
    .wordmark { font-weight: 700; letter-spacing: 0.42em; font-size: 18px; text-transform: uppercase; padding-left: .42em; text-align: center;
      background: linear-gradient(180deg, #ffffff 0%, #d9d9d9 55%, #9b9b9b 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .sub { margin-top: 10px; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: #6d6c67; text-align: center; }
  </style>
</head>
<body>
  <div>
    <div class="wordmark">UANDI AI</div>
    <div class="sub">UANDI AI, LLC — Confidential &amp; Proprietary</div>
  </div>
</body>
</html>
